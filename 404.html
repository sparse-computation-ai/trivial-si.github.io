<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f8f5" />
    <title>Not here — Trivial SuperIntelligence</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100svh; margin: 0; padding: 2rem; place-items: center; background: #f7f8f5; color: #152a40; font-family: Arial, sans-serif; }
      main { max-width: 30rem; }
      .label { color: #bd4317; font-family: monospace; font-size: .8rem; letter-spacing: .1em; }
      h1 { margin-block: 1rem; font-size: clamp(2.5rem, 7vw, 4rem); font-weight: 500; letter-spacing: -.06em; }
      p { line-height: 1.6; }
      a { display: inline-block; padding-block: .7rem; border-bottom: 1px solid; color: inherit; text-decoration: none; }
      a:focus-visible { outline: 2px solid #152a40; outline-offset: 5px; }
    </style>
  </head>
  <body>
    <main>
      <span class="label">404 / TRIVIAL SuperIntelligence</span>
      <h1>Nothing to see here.</h1>
      <p>We’re in stealth. This page is simply missing.</p>
      <a data-home href="./">Back to the beginning ↗</a>
    </main>
    <script>
      // GitHub project Pages can inherit an organization's custom domain.
      // Keep deep 404 links working both there and on a dedicated domain.
      const projectPath = "/trivial-si.github.io";
      const isProjectSite = location.pathname === projectPath || location.pathname.startsWith(`${projectPath}/`);
      document.querySelector("[data-home]").href = isProjectSite ? `${projectPath}/` : "/";
    </script>
  </body>
</html>
